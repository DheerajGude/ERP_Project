{% extends 'erp_analytics/base.html' %}
{% load static %}

{% block title %}Edit Sale{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold text-gray-700 mb-6">Edit Sale #{{ sale.id }}</h2>

<!-- Back Link -->
<a href="{% url 'sales_detail' sale.id %}" class="inline-block mb-6 text-blue-600 hover:underline">
    &larr; Back to Sale Details
</a>

<!-- Edit Form -->
<form method="POST" class="bg-white shadow-md rounded px-8 pt-6 pb-8 w-full max-w-3xl">
    {% csrf_token %}

    <!-- Customer -->
    <div class="mb-4">
        <label for="customer" class="block text-gray-700 text-sm font-bold mb-2">Customer</label>
        <select name="customer" id="customer" class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:ring-blue-500">
            <option value="">-- Select Customer --</option>
            {% for customer in customers %}
                <option value="{{ customer.id }}" {% if sale.customer.id == customer.id %}selected{% endif %}>{{ customer.name }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Product -->
    <div class="mb-4">
        <label for="product_name" class="block text-gray-700 text-sm font-bold mb-2">Product Name</label>
        <input type="text" name="product_name" id="product_name" value="{{ sale.product_name }}"
            class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:ring-blue-500" required>
    </div>

    <!-- Quantity -->
    <div class="mb-4">
        <label for="quantity" class="block text-gray-700 text-sm font-bold mb-2">Quantity</label>
        <input type="number" name="quantity" id="quantity" min="1" value="{{ sale.quantity }}"
            class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:ring-blue-500" required>
    </div>

    <!-- Price -->
    <div class="mb-4">
        <label for="price" class="block text-gray-700 text-sm font-bold mb-2">Price per Unit (₹)</label>
        <input type="number" name="price" id="price" min="0" step="0.01" value="{{ sale.price }}"
            class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:ring-blue-500" required>
    </div>

    <!-- Date -->
    <div class="mb-4">
        <label for="date" class="block text-gray-700 text-sm font-bold mb-2">Sale Date</label>
        <input type="date" name="date" id="date" value="{{ sale.date|date:'Y-m-d' }}"
            class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:ring-blue-500" required>
    </div>

    <!-- Submit -->
    <div class="flex justify-between items-center">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">
            Update Sale
        </button>
        <a href="{% url 'sales_detail' sale.id %}" class="text-gray-600 hover:underline">Cancel</a>
    </div>
</form>
{% endblock %}
