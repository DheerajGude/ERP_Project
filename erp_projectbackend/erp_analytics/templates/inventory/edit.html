{% extends 'erp_analytics/base.html' %}
{% load static %}

{% block title %}Edit Inventory Item{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold text-gray-700 mb-6">✏️ Edit Item: {{ item.name }}</h2>

<a href="{% url 'inventory_list' %}" class="inline-block mb-4 text-blue-600 hover:underline">
    &larr; Back to Inventory List
</a>

<form method="POST" class="bg-white shadow-md rounded-lg p-6 max-w-3xl">
    {% csrf_token %}

    <!-- Item Name -->
    <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Item Name</label>
        <input type="text" id="name" name="name" value="{{ item.name }}" class="w-full border rounded py-2 px-3 shadow-sm focus:ring focus:ring-blue-500" required>
    </div>

    <!-- Category -->
    <div class="mb-4">
        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <input type="text" id="category" name="category" value="{{ item.category }}" class="w-full border rounded py-2 px-3 shadow-sm focus:ring focus:ring-blue-500" required>
    </div>

    <!-- Quantity -->
    <div class="mb-4">
        <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
        <input type="number" id="quantity" name="quantity" value="{{ item.quantity }}" min="0" class="w-full border rounded py-2 px-3 shadow-sm focus:ring focus:ring-blue-500" required>
    </div>

    <!-- Unit Price -->
    <div class="mb-4">
        <label for="unit_price" class="block text-sm font-medium text-gray-700 mb-1">Unit Price (₹)</label>
        <input type="number" step="0.01" id="unit_price" name="unit_price" value="{{ item.unit_price }}" class="w-full border rounded py-2 px-3 shadow-sm focus:ring focus:ring-blue-500" required>
    </div>

    <!-- Reorder Level -->
    <div class="mb-4">
        <label for="reorder_level" class="block text-sm font-medium text-gray-700 mb-1">Reorder Threshold</label>
        <input type="number" id="reorder_level" name="reorder_level" value="{{ item.reorder_level }}" class="w-full border rounded py-2 px-3 shadow-sm focus:ring focus:ring-blue-500">
    </div>

    <!-- Action Buttons -->
    <div class="mt-6 flex items-center space-x-4">
        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-2 rounded">
            ✅ Update Item
        </button>
        <a href="{% url 'inventory_detail' item.id %}" class="text-gray-600 hover:underline">
            Cancel
        </a>
    </div>
</form>
{% endblock %}
