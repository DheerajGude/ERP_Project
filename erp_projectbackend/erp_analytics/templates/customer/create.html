{% extends 'erp_analytics/base.html' %}
{% load static %}

{% block title %}Add New Customer{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold text-gray-700 mb-6">➕ Add New Customer</h2>

<a href="{% url 'customer_list' %}" class="inline-block mb-4 text-blue-600 hover:underline">
    &larr; Back to Customer Directory
</a>

<form method="POST" class="bg-white shadow-md rounded-lg p-6 max-w-3xl">
    {% csrf_token %}

    <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input type="text" id="name" name="name" class="w-full border rounded py-2 px-3 shadow-sm focus:ring focus:ring-blue-500" required>
    </div>

    <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" id="email" name="email" class="w-full border rounded py-2 px-3 shadow-sm focus:ring focus:ring-blue-500" required>
    </div>

    <div class="mb-4">
        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="w-full border rounded py-2 px-3 shadow-sm focus:ring focus:ring-blue-500">
    </div>

    <div class="mb-4">
        <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Address</label>
        <textarea id="address" name="address" rows="3" class="w-full border rounded py-2 px-3 shadow-sm focus:ring focus:ring-blue-500"></textarea>
    </div>

    <!-- Submit and Cancel -->
    <div class="mt-6 flex items-center space-x-4">
        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-2 rounded">
            ✅ Save Customer
        </button>
        <a href="{% url 'customer_list' %}" class="text-gray-600 hover:underline">
            Cancel
        </a>
    </div>
</form>
{% endblock %}
