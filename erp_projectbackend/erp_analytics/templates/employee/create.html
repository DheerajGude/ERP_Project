{% extends 'erp_analytics/base.html' %}
{% load static %}

{% block title %}Add New Employee{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold text-gray-700 mb-6">➕ Add New Employee</h2>

<a href="{% url 'employee_list' %}" class="inline-block mb-4 text-blue-600 hover:underline">
    &larr; Back to Employee Directory
</a>

<form method="POST" class="bg-white shadow-md rounded-lg p-6 max-w-3xl">
    {% csrf_token %}

    <!-- Full Name -->
    <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input type="text" id="name" name="name" value="{{ form.name.value }}" class="w-full border rounded px-4 py-2 shadow-sm focus:ring focus:ring-blue-300" required>
    </div>

    <!-- Email -->
    <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" name="email" value="{{ form.email.value }}" class="w-full border rounded px-4 py-2 shadow-sm focus:ring focus:ring-blue-300" required>
    </div>

    <!-- Role -->
    <div class="mb-4">
        <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
        <select id="role" name="role" class="w-full border rounded px-4 py-2 shadow-sm focus:ring focus:ring-blue-300">
            {% for val, label in form.role.field.choices %}
                <option value="{{ val }}" {% if form.role.value == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Status -->
    <div class="mb-4">
        <label for="is_active" class="inline-flex items-center">
            <input type="checkbox" id="is_active" name="is_active" {% if form.is_active.value %}checked{% endif %} class="form-checkbox h-4 w-4 text-blue-600">
            <span class="ml-2 text-sm text-gray-700">Is Active</span>
        </label>
    </div>

    <!-- Joining Date -->
    <div class="mb-6">
        <label for="joined_date" class="block text-sm font-medium text-gray-700 mb-1">Joining Date</label>
        <input type="date" id="joined_date" name="joined_date" value="{{ form.joined_date.value }}" class="w-full border rounded px-4 py-2 shadow-sm focus:ring focus:ring-blue-300" required>
    </div>

    <!-- Submit Button -->
    <div class="flex justify-start">
        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-2 rounded">
            ✅ Create Employee
        </button>
    </div>
</form>
{% endblock %}
